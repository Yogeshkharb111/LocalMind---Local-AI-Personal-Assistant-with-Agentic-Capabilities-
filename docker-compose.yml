version: "3.9"

services:
  localmind:
    build: .
    container_name: localmind
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data          # Persist ChromaDB, memory, logs
      - ./skills/registry:/app/skills/registry  # Persist custom skills
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      # Verify the app's core deps import cleanly (LocalMind uses a local
      # Ollama backend via httpx — there is no anthropic dependency).
      test: ["CMD", "python", "-c", "import httpx, telegram, yaml; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3
