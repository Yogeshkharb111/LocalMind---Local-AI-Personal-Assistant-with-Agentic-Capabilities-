version: "3.9"

services:
  yogibot:
    build: .
    container_name: yogibot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data          # Persist ChromaDB, memory, logs
      - ./skills/registry:/app/skills/registry  # Persist custom skills
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import anthropic; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3
