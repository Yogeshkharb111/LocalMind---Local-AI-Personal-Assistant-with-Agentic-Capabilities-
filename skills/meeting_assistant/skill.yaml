name: meeting_assistant
description: >
  Records meetings via microphone, transcribes audio using Whisper,
  identifies speakers via pyannote diarization, extracts per-person notes,
  and generates a full meeting summary using the LLM.

triggers:
  - start meeting
  - start recording
  - record meeting
  - begin recording
  - stop meeting
  - stop recording
  - end meeting
  - end recording
  - finish recording
  - transcribe meeting
  - summarize meeting
  - meeting summary
  - schedule meeting
  - schedule recording
  - cancel meeting schedule
  - meeting notes
  - what was discussed
  - "summarize last"
  - "summarize meeting"  
  - "last meeting"
  - "process recording"

examples:
  - "start meeting recording"
  - "stop recording and summarize"
  - "schedule meeting at 3pm to 4pm"
  - "transcribe my meeting"
  - "give me meeting notes"
  - "start recording now"
  - "stop the meeting"
  - "schedule recording 15:00 to 16:00"
  - "cancel meeting schedule"
